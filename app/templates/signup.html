{% extends "base.html" %}

{% block title %}회원가입 - 가공식품 영양 비교{% endblock %}

{% block content %}
<section class="card form-card">
  <h2>회원가입</h2>
  <p class="muted small">이메일과 비밀번호만 받아요.</p>
  <form method="post" action="/signup">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>이메일 <input type="email" name="email" value="{{ email }}" maxlength="255" required autocomplete="username"></label>
    <label>비밀번호 <input type="password" name="password" maxlength="200" required autocomplete="new-password"></label>
    <p class="muted small" style="margin: 0">{{ rule }}</p>
    <button type="submit">가입하기</button>
  </form>
  <p class="small">이미 가입하셨나요? <a href="/login?next={{ next | urlencode }}">로그인</a></p>
</section>
{% endblock %}
